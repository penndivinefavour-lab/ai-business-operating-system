<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f1117" />
  <title>AI Business Operating System</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Login View -->
  <div id="login-view" class="login-view">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-icon">AI</div>
      </div>
      <h1>AI Business OS</h1>
      <p class="login-sub">Votre employé IA, prêt à travailler</p>
      <form id="login-form">
        <div class="field">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="admin@hotel.com" value="admin@hotel.com" />
        </div>
        <div class="field">
          <label>Mot de passe</label>
          <input type="password" id="login-password" placeholder="••••••••" value="admin123" />
        </div>
        <button type="submit" class="btn-primary btn-full">Se connecter</button>
      </form>
      <p class="login-hint">Démo: admin@hotel.com / admin123</p>
    </div>
  </div>

  <!-- App View -->
  <div id="app-view" class="app-view hidden">
    <!-- Sidebar (desktop) -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">AI</div>
        <div class="sidebar-brand">
          <div class="sidebar-brand-name">AI Business OS</div>
          <div class="sidebar-brand-sub" id="sidebar-hotel">Chargement...</div>
        </div>
      </div>
      <select id="hotel-select" class="hotel-select"></select>
      <nav class="sidebar-nav">
        <button data-view="overview" class="nav-item active"><span class="nav-icon">🏠</span> Accueil</button>
        <button data-view="employee" class="nav-item"><span class="nav-icon">👩‍💼</span> Mon Employé IA</button>
        <button data-view="conversations" class="nav-item"><span class="nav-icon">💬</span> Conversations</button>
        <button data-view="bookings" class="nav-item"><span class="nav-icon">📅</span> Réservations</button>
        <button data-view="leads" class="nav-item"><span class="nav-icon">🎯</span> Prospects</button>
        <button data-view="knowledge" class="nav-item"><span class="nav-icon">📚</span> Connaissances</button>
        <button data-view="services" class="nav-item"><span class="nav-icon">🛎️</span> Services</button>
        <button data-view="reports" class="nav-item"><span class="nav-icon">📊</span> Rapports</button>
        <button data-view="settings" class="nav-item"><span class="nav-icon">⚙️</span> Paramètres</button>
      </nav>
      <div class="sidebar-footer">
        <button id="logout" class="btn-ghost btn-full">Déconnexion</button>
      </div>
    </aside>

    <!-- Sidebar overlay (mobile) -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Main Content -->
    <main class="main">
      <header class="topbar">
        <button id="menu-btn" class="menu-btn">☰</button>
        <h1 id="page-title">Accueil</h1>
        <div class="topbar-actions">
          <button class="btn-icon" title="Notifications">🔔</button>
        </div>
      </header>
      <div id="main" class="content"></div>
    </main>

    <!-- Bottom Nav (mobile) -->
    <nav class="bottom-nav">
      <button data-view="overview" class="bottom-nav-item active"><span>🏠</span>Accueil</button>
      <button data-view="employee" class="bottom-nav-item"><span>👩‍💼</span>Employé</button>
      <button data-view="conversations" class="bottom-nav-item"><span>💬</span>Messages</button>
      <button data-view="bookings" class="bottom-nav-item"><span>📅</span>Réservations</button>
      <button data-view="leads" class="bottom-nav-item"><span>🎯</span>Prospects</button>
    </nav>
  </div>

  <!-- Onboarding Modal -->
  <div id="onboarding-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="ob-title">Configurer votre Employé IA</h2>
        <button class="modal-close" onclick="closeOnboarding()">✕</button>
      </div>
      <div class="modal-progress">
        <div class="modal-progress-bar" id="ob-progress"></div>
      </div>
      <div id="ob-content" class="modal-content"></div>
      <div class="modal-footer">
        <button class="btn-secondary" id="ob-prev" onclick="obPrev()">Retour</button>
        <button class="btn-primary" id="ob-next" onclick="obNext()">Continuer</button>
      </div>
    </div>
  </div>

  <!-- Test Employee Modal -->
  <div id="test-modal" class="modal-overlay hidden">
    <div class="modal modal-chat">
      <div class="modal-header">
        <h2 id="test-title">Tester votre Employé IA</h2>
        <button class="modal-close" onclick="closeTest()">✕</button>
      </div>
      <div id="test-chat" class="chat-messages"></div>
      <div class="chat-input">
        <input type="text" id="test-input" placeholder="Tapez un message client..." />
        <button class="btn-primary" onclick="sendTest()">Envoyer</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
